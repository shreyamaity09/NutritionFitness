<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>History | NutriTrack</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/feature.css') }}">
</head>

<body>

    <div class="feature-page">

        <!-- ==============================
             HEADER
        =============================== -->

        <div class="feature-header">

            <a href="/dashboard" class="back-button">
                ← Dashboard
            </a>

            <div class="feature-title">

                <span class="feature-icon">🕒</span>

                <div>
                    <h1>History</h1>
                    <p>View your previous health activities.</p>
                </div>

            </div>

        </div>


        <!-- ==============================
             HISTORY FILTER
        =============================== -->

        <div class="history-filter">

            <button
                class="history-filter-btn active"
                onclick="filterHistory('all', this)">
                All
            </button>

            <button
                class="history-filter-btn"
                onclick="filterHistory('meal', this)">
                🍽️ Meals
            </button>

            <button
                class="history-filter-btn"
                onclick="filterHistory('exercise', this)">
                🏋️ Exercise
            </button>

            <button
                class="history-filter-btn"
                onclick="filterHistory('water', this)">
                💧 Water
            </button>

            <button
                class="history-filter-btn"
                onclick="filterHistory('sleep', this)">
                😴 Sleep
            </button>

        </div>


        <!-- ==============================
             HISTORY CONTAINER
        =============================== -->

        <div id="historyContainer" class="history-container">
        </div>


        <!-- ==============================
             NO HISTORY MESSAGE
        =============================== -->

        <div
            id="noHistory"
            class="no-history"
            style="display: none;">

            <div class="no-history-icon">
                📋
            </div>

            <h3>No history found</h3>

            <p>
                Your health activities will appear here
                once you start using NutriTrack.
            </p>

        </div>


        <!-- ==============================
             FOOTER
        =============================== -->

        <div class="feature-page-footer">
            <p>NutriTrack • HEALTHIER YOU, EVERYDAY</p>
        </div>

    </div>


    <script src="{{ url_for('static', filename='js/history.js') }}"></script>

</body>
</html>
