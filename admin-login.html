<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - NutriTrack</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-login.css') }}">
</head>

<body>

    <div class="admin-login-container">

        <div class="admin-login-card">

            <div class="admin-login-logo">♥ NutriTrack</div>

            <h1>Admin Login</h1>

            <p class="auth-subtitle">
                Sign in to manage NutriTrack
            </p>

            <form id="adminLoginForm">

                <div class="admin-form-group">
                    <label for="adminUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="adminUsername"
                        placeholder="Enter admin username"
                        required
                    >
                </div>

                <div class="admin-form-group">
                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter admin password"
                        required
                    >
                </div>

                <p
                    id="adminLoginError"
                    style="display: none; color: #d9534f; margin-bottom: 15px;"
                ></p>

                <button type="submit" class="admin-login-button">
                    Login as Admin
                </button>

            </form>

            <div style="margin-top: 20px;">
                <a href="/" class="admin-back-home">
                    ← Back to Home
                </a>
            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='js/admin-login.js') }}"></script>

</body>
</html>
